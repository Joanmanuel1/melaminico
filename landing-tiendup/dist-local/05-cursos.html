<style>
.melc,
.melc.melc *,
.melc.melc *::before,
.melc.melc *::after { box-sizing: border-box; }
.melc {
  --melc-naranja: #f3792d;
  --melc-naranja-claro: #ff8e45;
  --melc-navy: #1b2128;
  --melc-crema: #f2eddd;
  --melc-blanco: #ffffff;
  --melc-gris-btn: #4a4a48;
  --melc-f-titulo: "Archivo Black", "Arial Black", Impact, sans-serif;
  --melc-f-texto: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  --melc-f-slab: "Alfa Slab One", Georgia, serif;
  --melc-pad: clamp(1.25rem, 6vw, 3rem);
  --melc-max: 1180px;
  --melc-gutter: var(--melc-pad);

  background: var(--melc-navy);
  color: var(--melc-blanco);
  font-family: var(--melc-f-texto);
  font-size: 16px;
  font-weight: 700;
  line-height: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;

  max-width: 100vw;
  margin-left: calc(50% - 50vw + var(--melc-sbw, 0px) / 2);
  margin-right: calc(50% - 50vw + var(--melc-sbw, 0px) / 2);
  overflow: hidden;
  overflow-x: hidden;
}
.melc.melc img,
.melc.melc video,
.melc.melc svg { display: block; max-width: 100%; }
.melc.melc h1,
.melc.melc h2,
.melc.melc h3,
.melc.melc p,
.melc.melc figure,
.melc.melc ul { margin: 0; padding: 0; }
.melc.melc ul { list-style: none; }
.melc.melc h1,
.melc.melc h2,
.melc.melc h3 {
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  line-height: inherit;
  letter-spacing: normal;
  text-transform: none;
  color: inherit;
}
.melc.melc a,
.melc.melc a:hover,
.melc.melc a:focus { color: inherit; text-decoration: none; }
.melc.melc a:not(.melc-uk-button),
.melc.melc a:not(.melc-uk-button):hover,
.melc.melc a:not(.melc-uk-button):focus { text-decoration: none !important; }
.melc.melc a:focus-visible { outline: 3px solid var(--melc-naranja); outline-offset: 4px; }
@media (min-width: 960px) {
.melc { --melc-gutter: max(var(--melc-pad), calc((100vw - var(--melc-max)) / 2)); }
}
.melc.melc-js .melc-reveal {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity .7s cubic-bezier(.16, 1, .3, 1), transform .7s cubic-bezier(.16, 1, .3, 1);
}
.melc.melc-js .melc-reveal.melc-is-visible { opacity: 1; transform: none; }
.melc.melc .melc-cursos { display: grid; grid-template-columns: 1fr 1fr; }
.melc.melc .melc-curso {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.25rem;
  padding: clamp(1.4rem, 5vw, 2.6rem) clamp(.9rem, 4vw, 2rem) clamp(1.6rem, 5vw, 2.6rem);
}
.melc.melc .melc-curso--inicial { background: var(--melc-navy); color: var(--melc-blanco); }
.melc.melc .melc-curso--completo { background: var(--melc-blanco); color: var(--melc-navy); }
.melc.melc .melc-curso h3 { font-family: var(--melc-f-titulo); font-weight: 400; font-size: clamp(1rem, 4.4vw, 1.9rem); letter-spacing: -.02em; }
.melc.melc .melc-curso--completo h3 { color: var(--melc-naranja); }
.melc.melc .melc-curso ul { align-self: stretch; list-style: disc; padding-left: 1.2rem; font-family: var(--melc-f-titulo); font-size: clamp(.875rem, 3.3vw, 1.2rem); line-height: 1.15; display: grid; gap: .1rem; }
.melc.melc .melc-curso li { display: list-item; }
.melc.melc .melc-curso li::marker { color: currentColor; }
.melc.melc .melc-curso__comprar {
  margin-top: auto;
  display: inline-flex;
  align-items: center;
  gap: .7rem;
  font-family: var(--melc-f-titulo);
  font-size: clamp(.875rem, 3.2vw, 1.05rem);
}
.melc.melc .melc-curso__comprar svg { width: clamp(28px, 8vw, 40px); height: clamp(28px, 8vw, 40px); color: var(--melc-naranja); }
.melc.melc .melc-curso__comprar span {
  padding: .65rem clamp(1rem, 5vw, 2.2rem);
  background: var(--melc-naranja);
  color: var(--melc-navy);
  border-radius: 10px;
  box-shadow: 3px 3px 0 rgba(0, 0, 0, .35);
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.melc.melc .melc-curso__comprar:hover span { background: var(--melc-naranja-claro); transform: translateY(-2px); box-shadow: 5px 5px 0 rgba(0, 0, 0, .35); }
@media (prefers-reduced-motion: reduce) {
.melc.melc .melc-curso__comprar span { transition: none; }
}
@media (min-width: 960px) {
.melc.melc .melc-curso { padding: 3rem 3rem 3.2rem; }
.melc.melc .melc-curso--inicial { padding-left: var(--melc-gutter); }
.melc.melc .melc-curso--completo { padding-right: var(--melc-gutter); }
.melc.melc .melc-curso h3 { font-size: 2rem; }
.melc.melc .melc-curso ul { font-size: 1.15rem; }
}
</style>

<script>
(function () {
  'use strict';
  try {
    var root = document.getElementById("melc-root");
    if (!root || root.dataset.fitInit) return;
    root.dataset.fitInit = "1";

    var fit = function () {
      var sbw = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
      root.style.setProperty("--melc-sbw", sbw + "px");
    };
    fit();

    if ("ResizeObserver" in window) {
      new ResizeObserver(fit).observe(document.documentElement);
    } else {
      window.addEventListener("resize", fit, { passive: true });
    }
  } catch (e) {}
})();
</script>

<script>
(function () {
  'use strict';
  try {
  var root = document.getElementById("melc-root");
  if (!root || root.dataset.motionInit) return;
  root.dataset.motionInit = "1";

  var els = root.querySelectorAll(".melc-reveal");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) return;

  root.classList.add("melc-js");

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add("melc-is-visible");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });

  els.forEach(function (el) { io.observe(el); });

  setTimeout(function () {
    els.forEach(function (el) { el.classList.add("melc-is-visible"); });
  }, 4000);
  } catch (e) {}
})();
</script>
