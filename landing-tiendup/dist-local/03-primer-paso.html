<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo+Black&family=Archivo+Narrow:wght@700&display=swap">
<style>
.melp,
.melp.melp *,
.melp.melp *::before,
.melp.melp *::after { box-sizing: border-box; }
.melp {
  --melp-naranja: #f3792d;
  --melp-naranja-claro: #ff8e45;
  --melp-navy: #1b2128;
  --melp-crema: #f2eddd;
  --melp-blanco: #ffffff;
  --melp-gris-btn: #4a4a48;
  --melp-f-titulo: "Archivo Black", "Arial Black", Impact, sans-serif;
  --melp-f-texto: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  --melp-f-slab: "Alfa Slab One", Georgia, serif;
  --melp-pad: clamp(1.25rem, 6vw, 3rem);
  --melp-max: 1180px;
  --melp-gutter: var(--melp-pad);

  background: var(--melp-navy);
  color: var(--melp-blanco);
  font-family: var(--melp-f-texto);
  font-size: 16px;
  font-weight: 700;
  line-height: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;

  max-width: 100vw;
  margin-left: calc(50% - 50vw + var(--melp-sbw, 0px) / 2);
  margin-right: calc(50% - 50vw + var(--melp-sbw, 0px) / 2);
  overflow: hidden;
  overflow-x: hidden;
}
.melp.melp img,
.melp.melp video,
.melp.melp svg { display: block; max-width: 100%; }
.melp.melp h1,
.melp.melp h2,
.melp.melp h3,
.melp.melp p,
.melp.melp figure,
.melp.melp ul { margin: 0; padding: 0; }
.melp.melp ul { list-style: none; }
.melp.melp h1,
.melp.melp h2,
.melp.melp h3 {
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  line-height: inherit;
  letter-spacing: normal;
  text-transform: none;
  color: inherit;
}
.melp.melp a,
.melp.melp a:hover,
.melp.melp a:focus { color: inherit; text-decoration: none; }
.melp.melp a:not(.melp-uk-button),
.melp.melp a:not(.melp-uk-button):hover,
.melp.melp a:not(.melp-uk-button):focus { text-decoration: none !important; }
.melp.melp a:focus-visible { outline: 3px solid var(--melp-naranja); outline-offset: 4px; }
@media (min-width: 960px) {
.melp { --melp-gutter: max(var(--melp-pad), calc((100vw - var(--melp-max)) / 2)); }
}
.melp.melp .melp-foto { position: relative; overflow: hidden; background: var(--melp-navy); }
.melp.melp .melp-foto img { width: 100%; height: 100%; object-fit: cover; }
.melp.melp .melp-foto figcaption { position: absolute; }
@media (min-width: 960px) {
.melp.melp .melp-foto img { position: absolute; inset: 0; }
}
.melp.melp .melp-chips { display: grid; grid-template-columns: 1fr 1fr; }
.melp.melp .melp-chip {
  display: flex;
  align-items: center;
  gap: .7rem;
  min-height: clamp(64px, 17vw, 96px);
  padding: .75rem clamp(.8rem, 3vw, 1.5rem);
  font-family: var(--melp-f-titulo);
  font-size: clamp(.875rem, 3.3vw, 1.1rem);
  line-height: 1.12;
  text-transform: uppercase;
}
.melp.melp .melp-chip svg { flex: none; width: clamp(24px, 6.5vw, 40px); height: clamp(24px, 6.5vw, 40px); color: var(--melp-naranja); }
.melp.melp .melp-chip--navy { background: var(--melp-navy); color: var(--melp-blanco); justify-content: flex-end; text-align: right; }
.melp.melp .melp-chip--blanco { background: var(--melp-blanco); color: var(--melp-naranja); }
.melp.melp .melp-chip--navy:has(svg:first-child) { justify-content: flex-start; text-align: left; }
.melp.melp .melp-chip--blanco:has(span:first-child) { justify-content: flex-end; text-align: right; }
@media (min-width: 960px) {
.melp.melp .melp-chip { font-size: 1rem; min-height: 96px; }
.melp.melp .melp-chip:nth-child(even) { padding-right: calc(var(--melp-gutter) * .5); }
}
.melp.melp-js .melp-reveal {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity .7s cubic-bezier(.16, 1, .3, 1), transform .7s cubic-bezier(.16, 1, .3, 1);
}
.melp.melp-js .melp-reveal.melp-is-visible { opacity: 1; transform: none; }
.melp.melp .melp-foto--paso { aspect-ratio: 9 / 9.3; }
.melp.melp .melp-foto--paso figcaption { inset: 0 auto auto 0; padding: clamp(2rem, 11vw, 4rem) 0 0 clamp(1.5rem, 8vw, 3rem); max-width: 80%; }
.melp.melp .melp-foto--paso h2 {
  font-family: var(--melp-f-titulo);
  font-weight: 400;
  font-size: clamp(1.7rem, 7.6vw, 3.3rem);
  line-height: 1.02;
  letter-spacing: -.03em;
  color: var(--melp-crema);
  text-shadow: 0 2px 14px rgba(0, 0, 0, .35);
}
.melp.melp .melp-taller { display: grid; grid-template-columns: 1fr 1fr; background: var(--melp-navy); }
.melp.melp .melp-taller__foto { position: relative; background: var(--melp-crema); padding-left: clamp(48px, 9vw, 56px); }
.melp.melp .melp-taller__foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.melp.melp .melp-taller__foto figcaption {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: clamp(48px, 9vw, 56px);
  background: var(--melp-crema);
  color: var(--melp-navy);
  display: flex;
  align-items: center;
  justify-content: center;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-family: var(--melp-f-titulo);
  font-size: clamp(1.35rem, 6.4vw, 2.6rem);
  letter-spacing: -.03em;
  line-height: 1;
  gap: .3rem;
}
.melp.melp .melp-taller__foto figcaption small { font-family: var(--melp-f-texto); font-size: max(.875rem, .32em); letter-spacing: .06em; text-transform: uppercase; }
.melp.melp .melp-taller__ig { padding: 1.5rem 1.2rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1rem; }
.melp.melp .melp-taller__ig img { width: min(72%, 220px); height: auto; border: 3px solid #000; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
.melp.melp .melp-taller__ig p { align-self: flex-end; text-align: right; font-family: var(--melp-f-titulo); font-size: clamp(.875rem, 2.8vw, .95rem); line-height: 1.15; }
@media (min-width: 960px) {
.melp.melp .melp-primer-paso { display: grid; grid-template-columns: 1.1fr .9fr; grid-template-rows: auto 1fr; }
.melp.melp .melp-primer-paso .melp-foto--paso { grid-row: 1 / 3; aspect-ratio: auto; min-height: 0; }
.melp.melp .melp-primer-paso .melp-foto--paso img { object-position: 60% 40%; }
.melp.melp .melp-primer-paso .melp-chips { grid-column: 2; }
.melp.melp .melp-primer-paso .melp-taller { grid-column: 2; height: 440px; }
.melp.melp .melp-foto--paso figcaption { padding-left: var(--melp-gutter); }
.melp.melp .melp-taller__foto img { position: absolute; inset: 0 0 0 clamp(48px, 9vw, 56px); width: calc(100% - clamp(48px, 9vw, 56px)); height: 100%; }
.melp.melp .melp-taller__foto figcaption { font-size: 1.7rem; }
.melp.melp .melp-taller__ig { padding: 2rem calc(var(--melp-gutter) * .5) 2rem 1.5rem; justify-content: center; gap: 2rem; }
.melp.melp .melp-taller__ig img { width: min(70%, 230px); }
.melp.melp .melp-taller__ig p { font-size: 1rem; }
}
</style>

<div class="melp" id="melp-root">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="melp-asterisco" viewBox="0 0 48 48">
    <g fill="currentColor">
      <rect x="20" y="2" width="8" height="44" rx="4"/>
      <rect x="20" y="2" width="8" height="44" rx="4" transform="rotate(45 24 24)"/>
      <rect x="20" y="2" width="8" height="44" rx="4" transform="rotate(90 24 24)"/>
      <rect x="20" y="2" width="8" height="44" rx="4" transform="rotate(135 24 24)"/>
    </g>
  </symbol>
</svg>

<section class="melp-primer-paso" aria-labelledby="melp-titulo">

  <figure class="melp-foto melp-foto--paso melp-reveal">
    <img src="../landing-demo/assets/img/foto-3859.jpg" alt="Nicolas Soto apoyado en un mueble de melamina terminado" loading="lazy">

      <h2 id="melp-titulo">TU PRIMER PASO PARA CONSTRUIR JUNTOS</h2>

  <ul class="melp-chips melp-reveal">

    <li class="melp-chip melp-chip--blanco"><svg aria-hidden="true"><use href="#melp-asterisco"/></svg><span>Asesorías personalizadas</span></li>
    <li class="melp-chip melp-chip--blanco"><span>Módulos teóricos</span><svg aria-hidden="true"><use href="#melp-asterisco"/></svg></li>

  <div class="melp-taller melp-reveal">

<script>
(function () {
  'use strict';
  try {
    var root = document.getElementById("melp-root");
    if (!root || root.dataset.fitInit) return;
    root.dataset.fitInit = "1";

    var fit = function () {
      var sbw = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
      root.style.setProperty("--melp-sbw", sbw + "px");
    };
    fit();

    if ("ResizeObserver" in window) {
      new ResizeObserver(fit).observe(document.documentElement);
    } else {
      window.addEventListener("resize", fit, { passive: true });
    }
  } catch (e) {}
})();
</script>

<script>
(function () {
  'use strict';
  try {
  var root = document.getElementById("melp-root");
  if (!root || root.dataset.motionInit) return;
  root.dataset.motionInit = "1";

  var els = root.querySelectorAll(".melp-reveal");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) return;

  root.classList.add("melp-js");

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add("melp-is-visible");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });

  els.forEach(function (el) { io.observe(el); });

  setTimeout(function () {
    els.forEach(function (el) { el.classList.add("melp-is-visible"); });
  }, 4000);
  } catch (e) {}
})();
</script>
