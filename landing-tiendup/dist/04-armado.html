<style>
.melv,
.melv.melv *,
.melv.melv *::before,
.melv.melv *::after { box-sizing: border-box; }
.melv {
  --melv-naranja: #f3792d;
  --melv-naranja-claro: #ff8e45;
  --melv-navy: #1b2128;
  --melv-crema: #f2eddd;
  --melv-blanco: #ffffff;
  --melv-gris-btn: #4a4a48;
  --melv-f-titulo: "Archivo Black", "Arial Black", Impact, sans-serif;
  --melv-f-texto: "Archivo Narrow", "Arial Narrow", Arial, sans-serif;
  --melv-f-slab: "Alfa Slab One", Georgia, serif;
  --melv-pad: clamp(1.25rem, 6vw, 3rem);
  --melv-max: 1180px;
  --melv-gutter: var(--melv-pad);

  background: var(--melv-navy);
  color: var(--melv-blanco);
  font-family: var(--melv-f-texto);
  font-size: 16px;
  font-weight: 700;
  line-height: normal;
  text-align: left;
  -webkit-font-smoothing: antialiased;

  max-width: 100vw;
  margin-left: calc(50% - 50vw + var(--melv-sbw, 0px) / 2);
  margin-right: calc(50% - 50vw + var(--melv-sbw, 0px) / 2);
  overflow: hidden;
  overflow-x: hidden;
}
.melv.melv img,
.melv.melv video,
.melv.melv svg { display: block; max-width: 100%; }
.melv.melv h1,
.melv.melv h2,
.melv.melv h3,
.melv.melv p,
.melv.melv figure,
.melv.melv ul { margin: 0; padding: 0; }
.melv.melv ul { list-style: none; }
.melv.melv h1,
.melv.melv h2,
.melv.melv h3 {
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  line-height: inherit;
  letter-spacing: normal;
  text-transform: none;
  color: inherit;
}
.melv.melv a,
.melv.melv a:hover,
.melv.melv a:focus { color: inherit; text-decoration: none; }
.melv.melv a:not(.melv-uk-button),
.melv.melv a:not(.melv-uk-button):hover,
.melv.melv a:not(.melv-uk-button):focus { text-decoration: none !important; }
.melv.melv a:focus-visible { outline: 3px solid var(--melv-naranja); outline-offset: 4px; }
@media (min-width: 960px) {
.melv { --melv-gutter: max(var(--melv-pad), calc((100vw - var(--melv-max)) / 2)); }
}
.melv.melv .melv-btn-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  padding: .9rem 2rem;
  background: var(--melv-blanco);
  color: var(--melv-gris-btn);
  border: 2px solid #000;
  border-radius: 22px;
  box-shadow: 8px 8px 0 rgba(0, 0, 0, .22);
  font-family: var(--melv-f-titulo);
  font-size: clamp(1rem, 4.2vw, 1.25rem);
  letter-spacing: -.01em;
  text-align: center;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.melv.melv a.melv-btn-pill:hover {
  color: var(--melv-gris-btn);
  transform: translate(-2px, -2px);
  box-shadow: 11px 11px 0 rgba(0, 0, 0, .25);
  background: var(--melv-crema);
}
.melv.melv .melv-btn-pill:active { transform: translate(4px, 4px); box-shadow: 3px 3px 0 rgba(0, 0, 0, .25); }
@media (prefers-reduced-motion: reduce) {
.melv.melv .melv-btn-pill { transition: none; }
}
.melv.melv-js .melv-reveal {
  opacity: 0;
  transform: translateY(26px);
  transition: opacity .7s cubic-bezier(.16, 1, .3, 1), transform .7s cubic-bezier(.16, 1, .3, 1);
}
.melv.melv-js .melv-reveal.melv-is-visible { opacity: 1; transform: none; }
.melv.melv .melv-armado {
  position: relative;
  min-height: min(150vw, 900px);
  padding: clamp(2rem, 9vw, 4rem) var(--melv-pad) clamp(2rem, 8vw, 3.5rem);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 2rem;
  overflow: hidden;
  isolation: isolate;
}
.melv.melv .melv-armado__video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
.melv.melv .melv-armado__yt { position: absolute; inset: 0; z-index: -2; overflow: hidden; container-type: size; pointer-events: none; }
.melv.melv .melv-armado__yt iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: max(100cqw, calc(100cqh * 9 / 16));
  height: max(100cqh, calc(100cqw * 16 / 9));
  transform: translate(-50%, -50%);
  border: 0;
}
.melv.melv .melv-armado__velo { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(27, 33, 40, .5), rgba(27, 33, 40, .05) 45%, rgba(27, 33, 40, .35)); }
.melv.melv .melv-armado__copy { max-width: var(--melv-max); width: 100%; margin: 0 auto; }
.melv.melv .melv-armado h2 {
  font-family: var(--melv-f-titulo);
  font-weight: 400;
  font-size: clamp(3rem, 15.5vw, 7.5rem);
  line-height: .86;
  letter-spacing: -.045em;
  color: var(--melv-crema);
}
.melv.melv .melv-armado h2 span { display: block; color: var(--melv-naranja); }
.melv.melv .melv-armado p {
  margin: clamp(2rem, 14vw, 7rem) 0 0 auto;
  max-width: 14ch;
  text-align: right;
  font-family: var(--melv-f-titulo);
  font-size: clamp(1.1rem, 5vw, 2rem);
  line-height: 1.08;
  text-shadow: 0 2px 14px rgba(0, 0, 0, .5);
}
.melv.melv .melv-armado p small { display: block; margin-top: .3rem; font-family: var(--melv-f-texto); font-size: max(.875rem, .5em); color: var(--melv-naranja); letter-spacing: .04em; }
.melv.melv .melv-btn-pill--armado { align-self: center; }
@media (min-width: 960px) {
.melv.melv .melv-armado { min-height: clamp(820px, 100vh, 1050px); }
.melv.melv .melv-armado__copy { display: grid; grid-template-columns: 1fr 1fr; align-items: end; gap: 2rem; }
.melv.melv .melv-armado p { margin: 0 0 0 auto; font-size: 2rem; }
}
</style>

<div class="melv" id="melv-root">
<section class="melv-armado" aria-labelledby="melv-titulo">
  <img class="melv-armado__video" src="https://bu-cdn.tiendup.com/business/91976/themes/lite/assets/img/o_1k44h36q3eaiofu1mu415id1quo54.jpg" alt="" aria-hidden="true">
  <div class="melv-armado__yt" aria-hidden="true"><iframe src="https://www.youtube-nocookie.com/embed/zXMLsR15_OM?autoplay=1&mute=1&loop=1&playlist=zXMLsR15_OM&controls=0&playsinline=1&rel=0&modestbranding=1&disablekb=1&iv_load_policy=3&fs=0" title="Video: armado del mueble" loading="lazy" allow="autoplay; encrypted-media" tabindex="-1"></iframe></div>
  <div class="melv-armado__velo" aria-hidden="true"></div>
  <div class="melv-armado__copy melv-reveal">

</section>

<script>
(function () {
  'use strict';
  try {
    var root = document.getElementById("melv-root");
    if (!root || root.dataset.fitInit) return;
    root.dataset.fitInit = "1";

    var fit = function () {
      var sbw = Math.max(0, window.innerWidth - document.documentElement.clientWidth);
      root.style.setProperty("--melv-sbw", sbw + "px");
    };
    fit();

    if ("ResizeObserver" in window) {
      new ResizeObserver(fit).observe(document.documentElement);
    } else {
      window.addEventListener("resize", fit, { passive: true });
    }
  } catch (e) {}
})();
</script>

<script>
(function () {
  'use strict';
  try {
  var root = document.getElementById("melv-root");
  if (!root || root.dataset.motionInit) return;
  root.dataset.motionInit = "1";

  var els = root.querySelectorAll(".melv-reveal");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) return;

  root.classList.add("melv-js");

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add("melv-is-visible");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });

  els.forEach(function (el) { io.observe(el); });

  setTimeout(function () {
    els.forEach(function (el) { el.classList.add("melv-is-visible"); });
  }, 4000);
  } catch (e) {}
})();
</script>

<script>
(function () {
  'use strict';
  try {
  var root = document.getElementById("melv-root");
  if (!root || root.dataset.videoInit) return;
  root.dataset.videoInit = "1";

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var yt = root.querySelector("iframe");
  if (yt && reduce) {
    yt.parentNode.removeChild(yt);
    return;
  }

  var video = root.querySelector("video");
  if (!video) return;

  if (reduce) {
    video.removeAttribute("autoplay");
    video.pause();
    return;
  }
  if (!("IntersectionObserver" in window)) return;

  new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      } else {
        video.pause();
      }
    });
  }, { threshold: 0.2 }).observe(video);
  } catch (e) {}
})();
</script>
